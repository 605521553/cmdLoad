[package]
name = "pata-commands"
version = "0.2.0"
description = "Pata Commands — local-first command manager for Windows developers"
authors = ["Pata Commands Contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "pata_commands_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
futures-util = "0.3.34"
parking_lot = "0.12"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1.54.1", features = ["sync", "time"] }
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Win32_System_Com",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Credentials",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
